<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoaP 전략 대시보드</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --bg-2: #0b1628;
      --surface: rgba(15, 27, 48, 0.92);
      --surface-2: rgba(21, 35, 58, 0.9);
      --surface-3: rgba(28, 43, 70, 0.88);
      --line: rgba(148, 163, 184, 0.18);
      --line-strong: rgba(148, 163, 184, 0.34);
      --text: #e5edf8;
      --muted: #93a4b8;
      --subtle: #64748b;
      --accent: #8fb7ff;
      --accent-2: #a6e3d7;
      --danger: #fb7185;
      --warn: #fbbf24;
      --good: #34d399;
      --neutral: #94a3b8;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
      --header-bg: rgba(7, 17, 31, 0.82);
      --note-bg: rgba(245, 158, 11, 0.13);
      --note-line: rgba(245, 158, 11, 0.35);
      --focus: rgba(143, 183, 255, 0.3);
      --chart-grid: rgba(148, 163, 184, 0.16);
      --chart-text: #93a4b8;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f7fb;
      --bg-2: #eef2f7;
      --surface: rgba(255, 255, 255, 0.96);
      --surface-2: rgba(248, 250, 252, 0.98);
      --surface-3: rgba(241, 245, 249, 0.95);
      --line: rgba(15, 23, 42, 0.1);
      --line-strong: rgba(15, 23, 42, 0.18);
      --text: #0f172a;
      --muted: #475569;
      --subtle: #64748b;
      --accent: #1d4ed8;
      --accent-2: #047857;
      --danger: #be123c;
      --warn: #b45309;
      --good: #047857;
      --neutral: #64748b;
      --shadow: 0 18px 55px rgba(15, 23, 42, 0.12);
      --header-bg: rgba(245, 247, 251, 0.86);
      --note-bg: rgba(254, 243, 199, 0.82);
      --note-line: rgba(217, 119, 6, 0.34);
      --focus: rgba(29, 78, 216, 0.18);
      --chart-grid: rgba(15, 23, 42, 0.11);
      --chart-text: #475569;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.16), transparent 34rem),
        radial-gradient(circle at top right, rgba(16, 185, 129, 0.10), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      letter-spacing: -0.015em;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    button { cursor: pointer; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(22px);
      background: var(--header-bg);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      display: grid;
      grid-template-columns: minmax(220px, auto) 1fr auto;
      gap: 18px;
      align-items: center;
      max-width: 1880px;
      margin: 0 auto;
      padding: 16px 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(143, 183, 255, 0.96), rgba(166, 227, 215, 0.88));
      box-shadow: 0 12px 26px rgba(59, 130, 246, 0.22);
      flex: none;
    }

    .brand-mark svg { width: 24px; height: 24px; color: #07111f; }

    .brand-title { font-size: 17px; font-weight: 760; line-height: 1.15; white-space: nowrap; }
    .brand-subtitle { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; }

    .top-tabs {
      display: flex;
      gap: 6px;
      align-items: center;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 1px;
    }

    .nav-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 820;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 0 8px 0 2px;
      white-space: nowrap;
      border-right: 1px solid var(--line);
      margin-right: 4px;
    }

    .tab-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 680;
      white-space: nowrap;
    }

    .tab-btn:hover { background: var(--surface-2); color: var(--text); }
    .tab-btn.active { background: var(--surface); border-color: var(--line-strong); color: var(--text); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }

    .header-actions { display: flex; align-items: center; gap: 10px; }
    .theme-toggle { width: auto; padding: 0 12px; gap: 7px; }
    .theme-toggle span { font-size: 12px; font-weight: 760; white-space: nowrap; }

    .period-pill {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .period-pill strong { color: var(--text); font-weight: 760; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      display: grid;
      place-items: center;
      color: var(--muted);
    }
    .icon-btn:hover { border-color: var(--line-strong); color: var(--text); background: var(--surface-2); }
    .icon-btn svg { width: 19px; height: 19px; }

    main {
      max-width: 1880px;
      margin: 0 auto;
      padding: 26px 28px 34px;
    }

    .page { display: none; }
    .page.active { display: block; }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 20px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(26px, 3vw, 38px); letter-spacing: -0.04em; line-height: 1.05; }
    h2 { font-size: 22px; letter-spacing: -0.03em; }
    h3 { font-size: 16px; letter-spacing: -0.02em; }
    .lead { margin-top: 10px; color: var(--muted); font-size: 14px; line-height: 1.62; max-width: 920px; }

    .grid { display: grid; gap: 16px; }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .overview-grid { grid-template-columns: minmax(0, 1.1fr) 430px; align-items: start; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }
    .card-pad { padding: 20px; }
    .section { margin-top: 18px; }

    .stat-card {
      padding: 18px;
      min-height: 126px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 720; }
    .stat-value { font-size: 32px; font-weight: 800; letter-spacing: -0.04em; margin-top: 8px; }
    .stat-note { color: var(--subtle); font-size: 12px; margin-top: 8px; line-height: 1.5; }

    .group-card {
      padding: 18px;
      overflow: hidden;
      position: relative;
    }
    .group-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: var(--group-color, var(--accent));
      opacity: .92;
    }
    .group-card-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 14px; }
    .group-title-wrap { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .org-mark {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--group-color) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--group-color) 38%, var(--line));
      display: grid;
      place-items: center;
      flex: none;
    }
    .org-mark svg { width: 23px; height: 23px; color: var(--group-color); }
    .group-name { font-size: 18px; font-weight: 780; }
    .group-desc { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .achievement { text-align: right; flex: none; }
    .achievement .num { font-size: 27px; font-weight: 820; line-height: 1; }
    .achievement .caption { font-size: 11px; color: var(--muted); margin-top: 6px; }

    .metric-mini-list { display: grid; gap: 8px; }
    .metric-mini {
      display: grid;
      grid-template-columns: 74px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px 10px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: 14px;
    }
    .metric-type {
      display: inline-flex;
      justify-content: center;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface);
      border-radius: 999px;
      font-size: 11px;
      padding: 4px 7px;
      white-space: nowrap;
      font-weight: 700;
    }
    .metric-name { font-size: 13px; font-weight: 760; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .metric-sub { font-size: 11px; color: var(--subtle); margin-top: 3px; }
    .metric-result { text-align: right; white-space: nowrap; }
    .metric-rate { font-size: 13px; font-weight: 800; }
    .target-actual { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      font-size: 11px;
      font-weight: 760;
      white-space: nowrap;
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.good { color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
    .status.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
    .status.danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
    .status.neutral { color: var(--neutral); background: color-mix(in srgb, var(--neutral) 9%, transparent); }

    .ai-panel {
      padding: 20px;
      position: sticky;
      top: 86px;
      border-color: color-mix(in srgb, var(--accent) 32%, var(--line));
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent 42%),
        var(--surface);
    }
    .ai-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .ai-title { font-size: 17px; font-weight: 800; }
    .ai-label { color: var(--muted); font-size: 12px; }
    .insight-list { display: grid; gap: 11px; }
    .insight-item {
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: 16px;
      padding: 13px;
    }
    .insight-kicker { color: var(--accent); font-size: 11px; font-weight: 800; margin-bottom: 6px; }
    .insight-text { color: var(--text); line-height: 1.52; font-size: 13px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 760;
    }
    .btn:hover { background: var(--surface-3); border-color: var(--line-strong); }
    .btn.primary { background: var(--accent); color: var(--bg); border-color: transparent; }
    .btn.ghost { background: transparent; }
    .btn.small { padding: 6px 9px; font-size: 11px; }

    .detail-ai-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
      padding: 18px;
      margin-bottom: 18px;
      border-left: 4px solid var(--group-color, var(--accent));
    }
    .detail-ai-top .lead { margin-top: 6px; max-width: none; }
    .ai-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }

    .metric-block {
      display: grid;
      grid-template-columns: 285px minmax(0, 1fr) 280px;
      grid-template-areas:
        "summary chart note"
        "summary raw note";
      gap: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .metric-summary { grid-area: summary; padding: 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-lg); }
    .metric-chart { grid-area: chart; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px; }
    .metric-raw { grid-area: raw; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
    .metric-note { grid-area: note; padding: 16px; background: var(--note-bg); border: 1px solid var(--note-line); border-radius: var(--radius-lg); min-height: 180px; }
    .metric-note h4 { margin: 0 0 9px; font-size: 13px; color: var(--text); }
    .metric-note p { color: var(--muted); line-height: 1.55; font-size: 13px; }

    .summary-label { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .summary-name { font-size: 18px; font-weight: 820; line-height: 1.22; }
    .summary-rate { font-size: 38px; font-weight: 850; margin-top: 16px; letter-spacing: -0.05em; }
    .summary-grid { display: grid; gap: 9px; margin-top: 18px; }
    .summary-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 12px; }
    .summary-row span:first-child { color: var(--muted); }
    .summary-row strong { font-weight: 780; }

    .chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .chart-title { font-weight: 780; font-size: 14px; }
    .chart-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .legend { display: flex; gap: 11px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 11px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-line { width: 18px; height: 2px; border-radius: 2px; background: currentColor; }
    .svg-chart { width: 100%; height: 230px; display: block; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; font-size: 12px; vertical-align: middle; }
    th { color: var(--muted); font-weight: 780; background: var(--surface-3); }
    td { color: var(--text); }
    .table-wrap { overflow-x: auto; }
    .muted { color: var(--muted); }
    .subtle { color: var(--subtle); }
    .nowrap { white-space: nowrap; }

    .milestone-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 16px;
      align-items: start;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 12px 0 16px;
    }
    .field, select, input, textarea {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 4px var(--focus); border-color: var(--accent); }
    textarea { width: 100%; resize: vertical; line-height: 1.5; min-height: 110px; }
    label { display: block; color: var(--muted); font-size: 12px; font-weight: 760; margin-bottom: 7px; }

    .heatmap {
      display: grid;
      grid-template-columns: 150px repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .heat-cell, .heat-head, .heat-row-label {
      border: 1px solid var(--line);
      border-radius: 14px;
      min-height: 58px;
      padding: 10px;
      background: var(--surface-2);
      font-size: 12px;
    }
    .heat-head { min-height: auto; color: var(--muted); font-weight: 800; text-align: center; background: var(--surface-3); }
    .heat-row-label { display: flex; align-items: center; font-weight: 760; }
    .heat-cell { cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .heat-cell:hover { border-color: var(--line-strong); transform: translateY(-1px); }
    .heat-main { font-size: 18px; font-weight: 850; }
    .heat-sub { color: var(--muted); font-size: 11px; }

    .risk-list { display: grid; gap: 10px; margin-top: 12px; }
    .risk-card {
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: 16px;
      padding: 13px;
    }
    .risk-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .risk-title { font-weight: 780; font-size: 13px; line-height: 1.35; }
    .risk-meta { color: var(--muted); font-size: 11px; margin-top: 6px; }
    .progress {
      height: 8px;
      background: var(--surface-3);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
      border: 1px solid var(--line);
    }
    .progress span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }

    .llm-console { position: sticky; top: 86px; padding: 18px; }
    .console-output {
      margin-top: 12px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface-2);
      min-height: 150px;
      color: var(--text);
      line-height: 1.6;
      font-size: 13px;
      white-space: pre-line;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 18px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(980px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 26px;
      box-shadow: var(--shadow);
    }
    .modal-head {
      position: sticky;
      top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 2;
    }
    .modal-body { padding: 20px; }
    .settings-section { margin-bottom: 22px; }
    .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .full { grid-column: 1 / -1; }

    .chat {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 70;
    }
    .chat-toggle {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
    }
    .chat-toggle svg { width: 25px; height: 25px; color: var(--accent); }
    .chat-panel {
      position: absolute;
      right: 0;
      bottom: 70px;
      width: min(420px, calc(100vw - 44px));
      display: none;
      padding: 16px;
    }
    .chat-panel.open { display: block; }
    .chat-messages { max-height: 320px; overflow: auto; display: grid; gap: 10px; margin: 12px 0; }
    .chat-msg { padding: 11px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; line-height: 1.5; }
    .chat-msg.user { background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
    .chat-row { display: flex; gap: 8px; }
    .chat-row input { flex: 1; }



    .overview-ai-wide {
      position: static;
      padding: 22px;
    }
    .overview-ai-wide .ai-title-row { margin-bottom: 16px; }
    .overview-ai-wide .insight-list {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }
    .overview-group-list { display: grid; gap: 16px; }
    .metric-mini-list.is-five {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: stretch;
    }
    .metric-mini.is-card {
      grid-template-columns: 1fr;
      align-content: space-between;
      min-height: 152px;
      padding: 13px;
      gap: 12px;
    }
    .metric-mini-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .metric-mini .metric-rate { font-size: 20px; }
    .core-star {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      color: #fbbf24;
      background: rgba(251,191,36,.12);
      border: 1px solid rgba(251,191,36,.28);
      flex: none;
    }
    .core-star svg { width: 14px; height: 14px; fill: currentColor; stroke: currentColor; }

    .metric-main-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .metric-hero-box {
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      background: color-mix(in srgb, var(--group-color, var(--accent)) 8%, var(--surface));
      padding: 13px;
    }
    .metric-hero-box .hero-label { color: var(--muted); font-size: 11px; font-weight: 800; }

  function m(groupId, name, type, unit, annualTarget, targets, actuals, insight, mode, raw, lowerIsBetter) {
    return { groupId, name, type, unit, annualTarget, targets, actuals, insight, mode: mode || 'latest', raw: raw || null, lowerIsBetter: !!lowerIsBetter };
  }

  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem('strategyDashboardSettings') || '{}');
      const migrated = Object.assign({}, saved);
      if (!migrated.reportYear && migrated.reportMonthLabel) {
        migrated.reportYear = Number.parseInt(migrated.reportMonthLabel, 10) || DEFAULT_SETTINGS.reportYear;
      }
      if (!migrated.organizationPrompt && migrated.kpiPrompt) migrated.organizationPrompt = migrated.kpiPrompt;
      return Object.assign({}, DEFAULT_SETTINGS, migrated);
    } catch (e) {
      return Object.assign({}, DEFAULT_SETTINGS);
    }
  }

  function saveSettings() {
    try {
      localStorage.setItem('strategyDashboardSettings', JSON.stringify(settings));
      return true;
    } catch (error) {
      console.warn('설정을 브라우저 저장소에 저장하지 못했습니다.', error);
      return false;
    }
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', settings.theme === 'light' ? 'light' : 'dark');
    const isLight = settings.theme === 'light';
    periodText.textContent = getReportMonthLabel();
    themeToggleText.textContent = isLight ? '다크' : '화이트';
    themeToggle.setAttribute('aria-label', isLight ? '다크 모드로 전환' : '화이트 모드로 전환');
  }

  function getReportMonthLabel() {
    return `${settings.reportYear}년 ${settings.reportMonthIndex + 1}월`;
  }

  function fmt(n, unit) {
    if (n === null || n === undefined || n === 0) return '-';
    const fixed = Math.abs(n) >= 100 ? 0 : (Math.abs(n) % 1 === 0 ? 0 : 1);
    return Number(n).toLocaleString('ko-KR', { maximumFractionDigits: fixed }) + (unit || '');
  }

  function sumUntil(arr, idx) {
    return arr.slice(0, idx + 1).reduce((a,b) => a + (Number(b) || 0), 0);
  }

  function metricCurrent(metric) {
    const idx = settings.reportMonthIndex;
    const target = metric.targets[idx] || 0;
    const actual = metric.actuals[idx] || 0;
    const cumulativeActual = metric.mode === 'sum' ? sumUntil(metric.actuals, idx) : actual;
    const annualBase = metric.mode === 'sum' ? metric.annualTarget : metric.annualTarget;
    const monthlyRate = getRate(actual, target, metric.lowerIsBetter);
    const annualRate = getRate(cumulativeActual, annualBase, metric.lowerIsBetter);
    return { idx, target, actual, cumulativeActual, monthlyRate, annualRate };
  }

  function getRate(actual, target, lowerIsBetter) {
    if (!target || !actual) return 0;
    if (lowerIsBetter) return Math.max(0, Math.min(160, (target / actual) * 100));
    return Math.max(0, Math.min(160, (actual / target) * 100));
  }

  function groupAverage(group) {
    const rates = group.metrics.map(metric => metricCurrent(metric).monthlyRate).filter(Boolean);
    return rates.length ? rates.reduce((a,b)=>a+b,0)/rates.length : 0;
  }

  function statusFor(rate) {
    if (rate >= 100) return { label:'달성', cls:'good' };
    if (rate >= 90) return { label:'정상', cls:'good' };
    if (rate >= 70) return { label:'주의', cls:'warn' };
    return { label:'위험', cls:'danger' };
  }

  function milestoneStatusClass(status) {
    if (status === '완료') return 'good';
    if (status === '지연') return 'danger';
    if (status === '주의') return 'warn';
    return 'neutral';
  }

  function buildMilestones() {
    const dimensions = [
      {code:'P', name:'Performance', label:'성과'},
      {code:'Q', name:'Quality', label:'품질'},
      {code:'C', name:'Cost', label:'비용'},
      {code:'T', name:'Time', label:'일정'}
    ];
    const verbs = ['상용화','고도화','전환','검증','확산','안정화','표준화','자동화','정합성 개선','운영 내재화'];
    const risks = ['의사결정 지연','외부 의존 일정','데이터 품질 편차','현업 적용률 저조','인프라 리소스 제약','검수 지연','계약 조건 협의','릴리즈 병목','목표 정의 불명확','성과지표 연결 미흡'];
    const list = [];
    GROUPS.forEach((g, gi) => {
      g.departments.forEach((dept, di) => {
        QUARTERS.forEach((q, qi) => {
          dimensions.forEach((dim, pi) => {
            const seed = gi * 29 + di * 11 + qi * 7 + pi * 5;
            const progress = Math.min(100, Math.max(15, 34 + seed + qi * 8 + (di % 3) * 5 - (pi === 3 ? 5 : 0)));
            let status = progress >= 92 ? '완료' : progress < 58 ? '지연' : progress < 76 ? '주의' : '진행중';
            if (qi === 0 && progress > 70) status = '완료';
            if (qi >= 2 && progress < 72) status = seed % 2 ? '주의' : '지연';
            list.push({
              id: `${g.id}-${di + 1}-q${qi + 1}-${dim.code}`,
              groupId: g.id,
              groupName: g.name,
              department: dept,
              quarter: q,
              dimension: dim.code,
              dimensionLabel: dim.label,
              title: `${dept} ${q} ${dim.label} ${verbs[(seed + qi + pi) % verbs.length]} 과제`,
              target: `${dim.label} 관점의 실행목표를 ${q} 내 완료하고 관련 전략지표 개선에 기여`,
              result: progress > 90 ? '완료 산출물 검수 및 운영 반영' : progress > 70 ? '핵심 산출물 진행, 일부 협의 잔여' : '일정 지연 및 실행 리스크 발생',
              progress,
              status,
              risk: risks[(seed + 2) % risks.length],
              nextAction: progress < 70 ? '담당 임원 의사결정 및 우선순위 재조정' : '다음 게이트 통과 기준 재확인'
            });
          });
        });
      });
    });
    return list;
  }

  function renderTabs() {
    const items = [{id:'overview', label:'전체'}].concat(GROUPS.map(g => ({id:g.id, label:g.shortName || g.name})), [{id:'milestones', label:'마일스톤'}]);
    tabs.innerHTML = `<span class="nav-label">대시보드</span>` + items.map(item => `<button class="tab-btn ${activePage === item.id ? 'active' : ''}" data-page="${item.id}">${item.label}</button>`).join('');
    tabs.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => { activePage = btn.dataset.page; render(); }));
  }

    else if (activePage === 'milestones') renderMilestones();

  }

  function lineChart(metric, color) {
    const width = 820, height = 260, pad = {l:34, r:18, t:62, b:30};
    const values = metric.targets.concat(metric.actuals.filter(Boolean));
    let min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (metric.lowerIsBetter) { min = Math.min(min, metric.annualTarget); max = Math.max(max, metric.annualTarget); }
    const span = max - min || 1;
    min = min - span * 0.16; max = max + span * 0.22;
    const x = i => pad.l + i * ((width - pad.l - pad.r) / 11);
    const y = v => height - pad.b - ((v - min) / (max - min)) * (height - pad.t - pad.b);
    const path = arr => arr.map((v,i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(v || min).toFixed(1)}`).join(' ');
    const idx = settings.reportMonthIndex;
    const grid = [0,1,2,3].map(i => {
      const gy = pad.t + i * ((height - pad.t - pad.b)/3);
      return `<line x1="${pad.l}" y1="${gy}" x2="${width-pad.r}" y2="${gy}" stroke="var(--chart-grid)"/>`;
    }).join('');
    const labels = metric.targets.map((_,i)=> `<text x="${x(i)}" y="${height-9}" text-anchor="middle" fill="var(--chart-text)" font-size="10.5">${i+1}월</text>`).join('');
    const actualPath = metric.actuals.map((v,i)=> v ? `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}` : '').filter(Boolean).join(' ');
    const points = metric.actuals.map((v,i)=> v ? `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${color}"/>` : '').join('');
    const rateLabels = metric.actuals.map((v,i)=> {
      if (!v) return '';
      const rate = getRate(v, metric.targets[i], metric.lowerIsBetter);
      const label = i === 0 ? `달성률: ${rate.toFixed(0)}%` : `${rate.toFixed(0)}%`;
      const tx = i === 0 ? x(i) + 20 : x(i);
      return `<text x="${tx}" y="26" text-anchor="middle" fill="${color}" font-size="10.5" font-weight="820">${label}</text>`;
    }).join('');
    return `<svg class="svg-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${metric.name} 월별 목표 실적 차트">
      ${grid}
      <line x1="${x(idx)}" y1="${pad.t}" x2="${x(idx)}" y2="${height-pad.b}" stroke="${color}" stroke-opacity="0.28" stroke-dasharray="5 5"/>
      <path d="${path(metric.targets)}" fill="none" stroke="var(--muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${actualPath}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      ${points}
      ${rateLabels}
      ${labels}
    </svg>`;
  }

  function metricTable(metric) {
    const idx = settings.reportMonthIndex;
    const months = metric.targets.map((_,i)=>`${i+1}월`);
    const cell = (content, i) => `<td class="${i === idx ? 'current-col' : ''}">${content}</td>`;
    const head = months.map((m,i)=>`<th class="${i === idx ? 'current-col' : ''}">${m}</th>`).join('');
    const nums = metric.targets.map((_,i)=>cell(metric.raw && metric.raw.num[i] ? metric.raw.num[i].toLocaleString('ko-KR') : '', i)).join('');
    const dens = metric.targets.map((_,i)=>cell(metric.raw && metric.raw.den[i] ? metric.raw.den[i].toLocaleString('ko-KR') : '', i)).join('');
    return `<div class="table-wrap"><table class="wide-metric-table raw-two-row-table"><thead><tr><th>구분</th>${head}</tr></thead><tbody>
      <tr><td>분자</td>${nums}</tr>
      <tr><td>분모</td>${dens}</tr>
    </tbody></table></div>`;
  }

      document.getElementById('milestoneConsole').textContent = milestoneInsight(btn.dataset.milestonePrompt);
    }));
    document.getElementById('milestoneAIButton').addEventListener('click', async () => {
      await updateMilestoneAI();
    });
  }

  function renderOwnerCards() {
    const visibleGroups = GROUPS.filter(g => milestoneFilters.group === 'all' || milestoneFilters.group === g.id);
    const cards = visibleGroups.flatMap(g => g.departments.map(dept => {
      const list = milestones.filter(m => m.department === dept && (milestoneFilters.quarter === 'all' || m.quarter === milestoneFilters.quarter));
      const total = list.length;
      const avg = total ? list.reduce((a,b)=>a+b.progress,0)/total : 0;
      const delayed = list.filter(m=>m.status==='지연').length;
      const caution = list.filter(m=>m.status==='주의').length;
      const pqct = ['P','Q','C','T'].map(code => `${code} ${list.filter(m=>m.dimension===code && m.status==='지연').length}`).join(' · ');
      const active = milestoneFilters.department === dept ? 'active' : '';
      return `<div class="owner-card ${active}" data-owner-dept="${dept}" data-owner-group="${g.id}">
        <div class="owner-title">${dept}</div>
        <div class="owner-meta">${g.name}</div>
        <div class="owner-kpis"><div class="owner-kpi"><strong>${total}</strong><span>과제</span></div><div class="owner-kpi"><strong>${avg.toFixed(0)}%</strong><span>완료율</span></div><div class="owner-kpi"><strong>${delayed}</strong><span>지연</span></div></div>
        <div class="pqct-row"><span class="pqct-pill">${pqct}</span><span class="pqct-pill">주의 ${caution}</span></div>
      </div>`;
    }));
    return `<div class="owner-grid">${cards.join('')}</div>`;
  }

  function renderTaskCards(list) {
    const rows = list.slice(0,36).map(m => `<div class="task-card">
      <div class="task-head"><div><div class="task-title">${m.title}</div><div class="risk-meta">${m.quarter} · ${m.dimension}(${m.dimensionLabel}) · ${m.groupName}</div></div><span class="status ${milestoneStatusClass(m.status)}">${m.status}</span></div>
      <div class="task-detail"><strong>목표</strong> ${m.target}<br><strong>실적</strong> ${m.result}</div>
      <div class="progress"><span style="width:${m.progress}%"></span></div>
      <div class="task-meta"><span class="pqct-pill">완료율 ${m.progress}%</span><span class="pqct-pill">리스크 ${m.risk}</span></div>
      <div class="task-detail"><strong>다음 액션</strong> ${m.nextAction}</div>
    </div>`).join('');
    return `<div class="milestone-task-grid">${rows}</div>`;
  }

  function setSelectValue(id, value) { const el = document.getElementById(id); if (el) el.value = value; }

  function filteredMilestones() {
    const q = milestoneFilters.query.trim().toLowerCase();
    return milestones.filter(m =>
      (milestoneFilters.group === 'all' || m.groupId === milestoneFilters.group) &&
      (milestoneFilters.department === 'all' || m.department === milestoneFilters.department) &&
      (milestoneFilters.quarter === 'all' || m.quarter === milestoneFilters.quarter) &&
      (milestoneFilters.pqct === 'all' || m.dimension === milestoneFilters.pqct) &&
      (milestoneFilters.status === 'all' || m.status === milestoneFilters.status) &&
      (!q || [m.groupName, m.department, m.title, m.risk, m.nextAction].join(' ').toLowerCase().includes(q))
    );
  }

  function renderHeatmap() {
    const heads = `<div></div>${QUARTERS.map(q=>`<div class="heat-head">${q}</div>`).join('')}`;
    const rows = GROUPS.map(g => {
      const cells = QUARTERS.map(q => {
        const list = milestones.filter(m => m.groupId === g.id && m.quarter === q);
        const delayed = list.filter(m=>m.status==='지연').length;
        const caution = list.filter(m=>m.status==='주의').length;
        const color = delayed ? 'var(--danger)' : caution ? 'var(--warn)' : 'var(--good)';
        return `<div class="heat-cell" data-heat-group="${g.id}" data-heat-quarter="${q}" style="border-color:color-mix(in srgb, ${color} 34%, var(--line)); background:color-mix(in srgb, ${color} 8%, var(--surface-2))">
          <div class="heat-main" style="color:${color}">${delayed}</div><div class="heat-sub">지연 · 주의 ${caution}</div>
        </div>`;
      }).join('');
      return `<div class="heat-row-label" style="color:${g.color}">${g.name}</div>${cells}`;
    }).join('');
    return `<div class="heatmap">${heads}${rows}</div>`;
  }

  function renderRiskList(list) {
    const risks = list.filter(m=>m.status==='지연' || m.status==='주의').sort((a,b)=> a.status === b.status ? a.progress - b.progress : (a.status === '지연' ? -1 : 1)).slice(0,10);
    if (!risks.length) return '<div class="muted">현재 필터 기준 지연·주의 항목이 없습니다.</div>';
    return risks.map(m => `<div class="risk-card">
      <div class="risk-top"><div><div class="risk-title">${m.title}</div><div class="risk-meta">${m.groupName} · ${m.department} · ${m.quarter} · ${m.dimensionLabel} · 리스크: ${m.risk}</div></div><span class="status ${milestoneStatusClass(m.status)}">${m.status}</span></div>
      <div class="progress"><span style="width:${m.progress}%"></span></div>
      <div class="risk-meta">다음 액션: ${m.nextAction}</div>
    </div>`).join('');

  function renderMilestoneTable(list) {
    const rows = list.slice(0,80).map(m => `<tr>

  function milestoneInsight(type) {
    const list = filteredMilestones();
    const delayed = list.filter(m=>m.status==='지연');
    const caution = list.filter(m=>m.status==='주의');
    const byGroup = GROUPS.map(g => ({name:g.name, delayed:delayed.filter(m=>m.groupId===g.id).length, caution:caution.filter(m=>m.groupId===g.id).length})).sort((a,b)=>(b.delayed+b.caution)-(a.delayed+a.caution));
    const top = byGroup[0] || {name:'-', delayed:0, caution:0};
    const byDept = Object.values(list.reduce((acc,m)=>{ acc[m.department] = acc[m.department] || {dept:m.department, delayed:0, caution:0, total:0}; acc[m.department].total++; if(m.status==='지연')acc[m.department].delayed++; if(m.status==='주의')acc[m.department].caution++; return acc; },{})).sort((a,b)=>(b.delayed+b.caution)-(a.delayed+a.caution))[0];
    if (type === 'pqct') {
      const byDim = ['P','Q','C','T'].map(code => ({code, delayed:delayed.filter(m=>m.dimension===code).length, caution:caution.filter(m=>m.dimension===code).length})).sort((a,b)=>(b.delayed+b.caution)-(a.delayed+a.caution));
      const topDim = byDim[0] || {code:'-', delayed:0, caution:0};
      return `PQCT 병목 요약
- 현재 필터 기준 ${topDim.code} 영역의 지연/주의가 가장 큽니다. 지연 ${topDim.delayed}개, 주의 ${topDim.caution}개입니다.
- 지표와 얼라인하려면 각 과제에 연결 KPI ID를 추가하고, 지표 부진과 동일 담당조직의 지연 과제를 함께 묶어 LLM에 전달하는 방식이 적합합니다.
- 출력 형식은 병목영역 / 근거과제 / 필요한 의사결정 / 다음 액션 4개로 제한하는 것이 좋습니다.`;
    }
    if (type === 'quarter') return `분기 병목 요약\n- 현재 필터 기준 지연 ${delayed.length}개, 주의 ${caution.length}개입니다.\n- 분기별 히트맵에서 지연 수가 높은 셀을 클릭하면 해당 그룹/분기 목록으로 좁혀볼 수 있습니다.\n- LLM 연동 시에는 분기, 담당조직, 상태, 리스크 메모만 먼저 넣고 상세 설명은 2차 질의로 분리하는 것이 안전합니다.`;
    if (type === 'owner') return `담당조직 과부하 요약\n- 우선 확인 대상은 ${byDept ? byDept.dept : '-'}입니다. 지연 ${byDept ? byDept.delayed : 0}개, 주의 ${byDept ? byDept.caution : 0}개가 있습니다.\n- 담당조직별 마일스톤 수와 지연 수를 함께 넣어 LLM에 묻는 방식이 단순 상태 나열보다 유용합니다.\n- 권장 질문: “이 담당조직의 지연 원인을 리스크 유형별로 묶고, 임원 의사결정이 필요한 항목만 분리해줘.”`;
    if (type === 'meeting') return `임원회의 안건 초안\n1. ${top.name}의 지연/주의 마일스톤 집중 원인 확인\n2. 지연 ${delayed.length}개 중 외부 의존, 데이터 품질, 인프라 리소스 제약 항목 분리\n3. 다음 분기 목표 달성에 영향을 주는 선행 마일스톤 재조정\n4. 담당조직별 과부하 해소를 위한 우선순위 조정안 확정`;
    return `지연 위험 요약\n- 현재 필터 기준 지연 ${delayed.length}개, 주의 ${caution.length}개입니다.\n- 가장 관리가 필요한 그룹은 ${top.name}입니다.\n- LLM에는 전체 100개를 한 번에 넣기보다 “지연/주의 항목만 압축한 JSON”을 넣고, 출력은 위험요인/필요결정/다음액션 3개 필드로 제한하는 것이 좋습니다.`;
  }

  function collectAndSaveSettings() {
    collectSettingsFromForm();
    saveSettings();
    settingsModal.classList.remove('open');
    render();
  }

  function exportJson() {
    const payload = { settings, groups: GROUPS, milestones, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'strategy-dashboard-data.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function showSettingsMessage(message, isError) {
    const box = document.getElementById('settingsMessage');
    if (!box) return;
    box.style.display = 'block';
    box.style.color = isError ? 'var(--danger)' : 'var(--text)';
    box.textContent = message;
  }

  async function importJsonFile(file) {
    try {
      const parsed = JSON.parse(await file.text());
      if (!parsed || typeof parsed !== 'object') throw new Error('올바른 JSON 객체가 아닙니다.');
      if (parsed.settings && typeof parsed.settings === 'object') {
        settings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings);
      }
      if (Array.isArray(parsed.milestones)) milestones = parsed.milestones;
      saveSettings();
      renderSettings();
      showSettingsMessage('JSON 데이터를 가져왔습니다.');
      render();
    } catch (error) {
      showSettingsMessage(error instanceof Error ? error.message : 'JSON 파일을 가져오지 못했습니다.', true);
    } finally {
      importJsonInput.value = '';
    }
  }

  function restoreSampleData() {
    milestones = buildMilestones();
    milestoneFilters = { group:'all', department:'all', quarter:'all', pqct:'all', status:'all', query:'' };
    showSettingsMessage('샘플 데이터를 복원했습니다.');
  }

  function clearStoredData() {
    try {
      localStorage.removeItem('strategyDashboardSettings');
    } catch (error) {
      console.warn('브라우저 저장소를 초기화하지 못했습니다.', error);
    }
    settings = Object.assign({}, DEFAULT_SETTINGS);
    milestones = buildMilestones();
    applyTheme();
    renderSettings();
    showSettingsMessage('localStorage와 설정을 초기화했습니다.');
    render();
  }

  function buildGroupPrompt(group) {
    const metrics = group.metrics.map(metric => {
      const cur = metricCurrent(metric);
      return {name:metric.name, type:metric.type, monthlyTarget:cur.target, monthlyActual:cur.actual, monthlyRate:Number(cur.monthlyRate.toFixed(1)), annualTarget:metric.annualTarget, annualRate:Number(cur.annualRate.toFixed(1)), insight:metric.insight};
    });
    const exec = milestones.filter(m=>m.groupId===group.id).map(m=>({department:m.department, quarter:m.quarter, pqct:m.dimension, task:m.title, progress:m.progress, status:m.status, risk:m.risk}));
    return `${settings.systemPrompt}\n\n${settings.organizationPrompt}\n\n분석대상: ${group.name}\n기준월: ${getReportMonthLabel()}\n지표 데이터 JSON:\n${JSON.stringify(metrics)}\n\n실행과제 요약 JSON:\n${JSON.stringify(exec.filter(x=>x.status==='지연'||x.status==='주의').slice(0,80))}`;
  }

  function buildOverallPrompt() {
    const metrics = GROUPS.flatMap(g => g.metrics.map(metric => {
      const cur = metricCurrent(metric);
      return {group:g.name, metric:metric.name, type:metric.type, monthlyTarget:cur.target, monthlyActual:cur.actual, monthlyRate:Number(cur.monthlyRate.toFixed(1)), annualTarget:metric.annualTarget, annualRate:Number(cur.annualRate.toFixed(1))};
    }));
    const exec = milestones.filter(x=>x.status==='지연'||x.status==='주의').slice(0,120).map(m=>({group:m.groupName, department:m.department, quarter:m.quarter, pqct:m.dimension, task:m.title, progress:m.progress, status:m.status, risk:m.risk}));
    return `${settings.systemPrompt}\n\n${settings.overallPrompt}\n\n부문 전체 관점으로 분석하세요. 조직별 화면과 중복되지 않도록 교차 조직 리스크, 공통 병목, 임원 의사결정 안건만 뽑으세요.\n기준월: ${getReportMonthLabel()}\n지표 데이터 JSON:\n${JSON.stringify(metrics)}\n\n지연/주의 실행과제 JSON:\n${JSON.stringify(exec)}`;
  }

  function buildMilestonePrompt() {
    const list = filteredMilestones().filter(m=>m.status==='지연'||m.status==='주의').slice(0,150).map(m=>({group:m.groupName, department:m.department, quarter:m.quarter, pqct:m.dimension, title:m.title, target:m.target, result:m.result, progress:m.progress, status:m.status, risk:m.risk, nextAction:m.nextAction}));
    return `${settings.systemPrompt}\n\n${settings.milestonePrompt}\n\n기준월: ${getReportMonthLabel()}\n전략과제 실행 데이터 JSON:\n${JSON.stringify(list)}`;
  }

  function fallbackLocalInsight(taskType) {
    if (taskType === 'test') return '로컬 샘플 분석이 정상 동작합니다. Endpoint를 입력하면 같은 버튼으로 사내 LLM 연결을 검증합니다.';
    if (taskType === 'overall') return 'Endpoint가 설정되지 않아 부문 전체 샘플 인사이트를 표시했습니다.';
    if (taskType === 'organization') return 'Endpoint가 설정되지 않아 조직별 샘플 분석을 표시했습니다.';
    if (taskType === 'milestone') return milestoneInsight('meeting');
    return 'Endpoint가 설정되지 않아 현재 대시보드 데이터 기반의 로컬 분석을 표시했습니다.';
  }

  async function callInternalLLM({ taskType, prompt, data }) {
    if (!settings.llmEndpoint) return fallbackLocalInsight(taskType, data);
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), settings.timeoutMs);
    try {
      const response = await fetch(settings.llmEndpoint, {
        method: 'POST',
        headers: Object.assign({'Content-Type':'application/json'}, settings.apiKey ? {'Authorization': `Bearer ${settings.apiKey}`} : {}),
        body: JSON.stringify({ taskType, model: settings.modelName, prompt, data }),
        signal: controller.signal
      });
      if (!response.ok) throw new Error(`사내 LLM 호출에 실패했습니다. 상태 코드: ${response.status}`);
      const result = await response.json();
      return result.text || result.answer || result.output || result.message || JSON.stringify(result);
    } catch (error) {
      if (error instanceof DOMException && error.name === 'AbortError') {
        throw new Error(`사내 LLM 응답이 ${settings.timeoutMs / 1000}초 안에 도착하지 않았습니다.`);
      }
      throw error;
    } finally {
      clearTimeout(timeoutId);
    }
  }

  async function updateGroupAI(group) {
    const box = document.getElementById('groupAIBox');
    box.innerHTML = renderGroupAI(group, true) + `<div class="console-output" style="grid-column:1/-1;min-height:auto">사내 LLM 연결 정보가 있으면 실제 분석을 호출합니다. 현재는 로컬 샘플 분석을 표시합니다.</div>`;
    try {
      const text = await callInternalLLM({
        taskType: 'organization',
        prompt: buildGroupPrompt(group),
        data: { groupId: group.id, reportMonth: getReportMonthLabel() }
      });
      if (text) box.innerHTML = renderGroupAI(group, true, text);
    } catch (e) {
      box.insertAdjacentHTML('beforeend', `<div class="console-output" style="grid-column:1/-1;min-height:auto;color:var(--danger)">${escapeHtml(e.message)}</div>`);
    }
  }

  async function updateOverallAI() {
    const box = document.getElementById('overallAI');
    box.innerHTML = renderOverallAI(true);
    try {
      const text = await callInternalLLM({
        taskType: 'overall',
        prompt: buildOverallPrompt(),
        data: { reportMonth: getReportMonthLabel(), groupCount: GROUPS.length }
      });
      if (text) box.innerHTML = `<div class="ai-title-row"><div><div class="ai-title">AI 전체 인사이트</div><div class="ai-label">사내 LLM 분석 갱신 결과</div></div><span class="status neutral">갱신됨</span></div><div class="insight-item"><div class="insight-kicker">LLM 분석 결과</div><div class="insight-text">${escapeHtml(text).replace(/\n/g,'<br>')}</div></div>`;
    } catch(e) {
      box.insertAdjacentHTML('beforeend', `<div class="insight-item"><div class="insight-kicker">호출 오류</div><div class="insight-text" style="color:var(--danger)">${escapeHtml(e.message)}</div></div>`);
    }
  }

  async function updateMilestoneAI() {
    const box = document.getElementById('milestoneConsole');
    box.textContent = milestoneInsight('meeting');
    try {
      const text = await callInternalLLM({
        taskType: 'milestone',
        prompt: buildMilestonePrompt(),
        data: { filters: milestoneFilters, itemCount: filteredMilestones().length }
      });
      if (text) box.textContent = text;
    } catch(e) {
      box.textContent = milestoneInsight('meeting') + '\n\n호출 오류: ' + e.message;
    }
  }

  function openChat(prefill) {
    document.getElementById('chatPanel').classList.add('open');
    if (prefill) {
      document.getElementById('chatInput').value = prefill;
      answerChat(prefill);
    }
  }

  function answerChat(question) {
    const messages = document.getElementById('chatMessages');
    messages.insertAdjacentHTML('beforeend', `<div class="chat-msg user">${escapeHtml(question)}</div>`);
    const avg = GROUPS.reduce((a,g)=>a+groupAverage(g),0)/GROUPS.length;
    const delayed = milestones.filter(m=>m.status==='지연').length;
    let answer = `요약: ${getReportMonthLabel()} 기준 부문 평균 달성률은 ${avg.toFixed(1)}%이고, 지연 실행과제는 ${delayed}개입니다.\n근거: 5개 조직의 25개 월 지표와 25개 담당조직의 분기 마일스톤을 기준으로 계산했습니다.\n추천 액션: 목표 미달 지표와 지연 실행과제가 동시에 발생한 조직을 우선 확인하세요.`;
    if (question.includes('회의')) answer = milestoneInsight('meeting');
    if (question.includes('지연')) answer = milestoneInsight('risk');
    messages.insertAdjacentHTML('beforeend', `<div class="chat-msg">${escapeHtml(answer).replace(/\n/g,'<br>')}</div>`);
    messages.scrollTop = messages.scrollHeight;
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  }

  document.getElementById('settingsBtn').addEventListener('click', () => { renderSettings(); settingsModal.classList.add('open'); });
  themeToggle.addEventListener('click', () => {
    settings.theme = settings.theme === 'light' ? 'dark' : 'light';
    saveSettings();
    applyTheme();
  });
  importJsonInput.addEventListener('change', () => {
    const file = importJsonInput.files && importJsonInput.files[0];
    if (file) importJsonFile(file);
  });
  document.getElementById('closeSettings').addEventListener('click', () => settingsModal.classList.remove('open'));
  settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) settingsModal.classList.remove('open'); });
  document.getElementById('chatToggle').addEventListener('click', () => document.getElementById('chatPanel').classList.toggle('open'));
  document.getElementById('chatSend').addEventListener('click', () => { const input = document.getElementById('chatInput'); const q = input.value.trim(); if (q) { answerChat(q); input.value = ''; } });
  document.getElementById('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('chatSend').click(); });
  document.querySelectorAll('[data-chat-q]').forEach(btn => btn.addEventListener('click', () => answerChat(btn.dataset.chatQ)));

  applyTheme();
  render();
})();
</script>
</body>
</html>
